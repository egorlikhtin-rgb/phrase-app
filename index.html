<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #10b981;
    --gold: #f59e0b;
    --purple: #a855f7;
    --danger: #ef4444;
    --border: rgba(255,255,255,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 15px; flex-direction: column;
    transition: background 0.6s ease;
  }
  
  .app-container {
    background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 30px; width: 100%; max-width: 650px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    position: relative; overflow: hidden; min-height: 420px;
    display: flex; flex-direction: column;
  }

  .mode-switch { display: flex; gap: 8px; margin-bottom: 25px; justify-content: center; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 30px; flex-wrap: wrap; }
  .mode-btn { padding: 8px 16px; font-size: 0.85rem; background: transparent; border: none; color: var(--muted); border-radius: 25px; cursor: pointer; font-weight: 600; transition: 0.2s; }
  .mode-btn.active { background: var(--accent); color: white; }
  .mode-btn:hover:not(.active) { color: var(--text); }

  .type-header { font-size: 0.9rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .type-badge { padding: 5px 15px; border-radius: 20px; display: inline-block; }
  
  .phrase-title { font-size: 2rem; font-weight: 800; line-height: 1.35; margin-bottom: 25px; color: var(--text); text-align: center; flex-grow: 1; display: flex; align-items: center; justify-content: center; }

  .answer-block { display: none; padding-top: 20px; border-top: 1px dashed rgba(255,255,255,0.15); text-align: left; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .meaning { font-size: 1.15rem; color: var(--text); line-height: 1.5; margin-bottom: 15px; }
  .quote-author { font-size: 1rem; color: var(--gold); font-weight: 700; margin-bottom: 15px; font-style: italic; }
  .example-box { background: rgba(16,185,129,0.1); border-left: 4px solid var(--success); padding: 15px; border-radius: 8px; font-style: italic; color: #d1fae5; font-size: 0.95rem; }
  .example-box span { display: block; font-size: 0.75rem; color: var(--success); font-weight: 700; margin-bottom: 5px; text-transform: uppercase; font-style: normal;}

  .controls { display: flex; gap: 10px; margin-top: 25px; justify-content: center; flex-wrap: wrap; }
  button { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s; flex: 1; min-width: 120px; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); }
  .btn-secondary:hover { background: rgba(255,255,255,0.15); }
  .btn-fav { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
  .btn-fav:hover { background: rgba(239,68,68,0.3); }
  .btn-fav.active { background: var(--danger); color: white; }
  .btn-theme { background: rgba(168,85,247,0.2); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.4); }
  .btn-theme:hover { background: rgba(168,85,247,0.3); }
  
  .counter { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 20px; }
</style>
</head>
<body>

<div class="app-container">

    <button class="mode-btn active" onclick="setMode('all')">🎲 Всё вперемешку</button>
    <button class="mode-btn" onclick="setMode('phrase')">📖 Фразеологизмы</button>
    <button class="mode-btn" onclick="setMode('quote')">💬 Цитаты</button>

    <button class="mode-btn" onclick="setMode('fav')">⭐ Избранное</button>

      <button class="btn-theme" onclick="exportFavorites()" style="margin-left: 8px;">💾 Экспорт</button>
     <button class="btn-theme" onclick="openGamesMenu()" style="margin-left: 8px; background: #e67e22; color: white;">🎮 Игры</button>

<!-- МОДАЛЬНОЕ ОКНО ВИКТОРИНЫ -->
<div id="quizModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 1000; align-items: center; justify-content: center; flex-direction: column; color: #fff; padding: 20px; box-sizing: border-box;">
  <div style="max-width: 600px; width: 100%; text-align: center;">

      <span>Время: <b id="quizTimer">25</b></span>
      <span>Очки: <b id="quizScore">0</b></span>

    <div id="quizQuestion" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 20px; min-height: 60px;"></div>

    <div id="quizOptions" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;"></div>

    <button id="quizCloseBtn" onclick="closeQuiz()" style="display: none; background: #e74c3c; color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%;">Закрыть</button>
  </div>
</div>

<!-- МЕНЮ ВЫБОРА ИГР -->
<div id="gamesModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 900; align-items: center; justify-content: center; flex-direction: column; color: #fff; padding: 20px; box-sizing: border-box;">
  <div style="max-width: 600px; width: 100%; text-align: center;">

    <button onclick="closeGamesMenu()" style="background: #e74c3c; color: white; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%;">Закрыть</button>

<script>
const THEMES = [
  { name: "Ночь", bg: "#0f172a", card: "rgba(30, 41, 59, 0.85)", text: "#f8fafc", muted: "#94a3b8" },
  { name: "Космос", bg: "#0b0914", card: "rgba(25, 20, 45, 0.85)", text: "#e0d4ff", muted: "#a78bfa" },
  { name: "Лес", bg: "#0f1a14", card: "rgba(20, 40, 30, 0.85)", text: "#dcfce7", muted: "#86efac" },
  { name: "Закат", bg: "#1a0f0f", card: "rgba(50, 20, 20, 0.85)", text: "#fee2e2", muted: "#fca5a5" },
  { name: "Океан", bg: "#0a1628", card: "rgba(15, 35, 60, 0.85)", text: "#e0f2fe", muted: "#7dd3fc" }
];
let currentThemeIdx = parseInt(localStorage.getItem('pax_theme') || '0');

function applyTheme() {
  const t = THEMES[currentThemeIdx];
  document.body.style.background = t.bg;
  document.querySelector('.app-container').style.background = t.card;
  document.querySelector('.app-container').style.color = t.text;
  document.querySelectorAll('.mode-btn').forEach(el => {
    if (!el.classList.contains('active')) el.style.color = t.muted;
  });
  document.querySelectorAll('.phrase-title, .meaning').forEach(el => el.style.color = t.text);
  document.querySelector('.counter').style.color = t.muted;
}

function changeTheme() {
  currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
  localStorage.setItem('pax_theme', currentThemeIdx);
  applyTheme();
}

  { type: 'proverb', text: 'А Васька слушает да ест.', meaning: 'О том, кто не обращает внимания на слова.', example: 'Ему говоришь, а он — А Васька слушает да ест.' },

  { type: 'proverb', text: 'Беда не приходит одна.', meaning: 'Трудности идут чередой.', example: 'Как назло, беда не приходит одна.' },
  { type: 'proverb', text: 'Без копейки рубль не живёт.', meaning: 'Всё складывается из мелочей.', example: 'Экономь, без копейки рубль не живёт.' },
  { type: 'proverb', text: 'Без соли невкусно, а без воли не житьё.', meaning: 'Свобода важна.', example: 'Нельзя жить в неволе, без соли невкусно, а без воли не житьё.' },
  { type: 'proverb', text: 'Береги бровь, а глаз будет цел.', meaning: 'Заботься о главном.', example: 'Смотри за основным, береги бровь, а глаз будет цел.' },
  { type: 'proverb', text: 'Ближний сосед лучше дальней родни.', meaning: 'Помощь соседа важнее.', example: 'Позови соседа, ближний сосед лучше дальней родни.' },
  { type: 'proverb', text: 'Бог дал, Бог и взял.', meaning: 'Смирение с утратой.', example: 'Не плачь, Бог дал, Бог и взял.' },
  { type: 'proverb', text: 'Большому кораблю — большое плавание.', meaning: 'Большим людям — большие дела.', example: 'Ты способный, большому кораблю — большое плавание.' },
  { type: 'proverb', text: 'Будет и на нашей улице праздник.', meaning: 'Надежда на лучшее.', example: 'Не переживай, будет и на нашей улице праздник.' },
  { type: 'proverb', text: 'Была бы охота — заладится любая работа.', meaning: 'Желание помогает в труде.', example: 'Берись смелее, была бы охота — заладится любая работа.' },
  { type: 'proverb', text: 'В гостях хорошо, а дома лучше.', meaning: 'Дом — самое лучшее место.', example: 'Погостили и хватит, в гостях хорошо, а дома лучше.' },
  { type: 'proverb', text: 'В здоровом теле — здоровый дух.', meaning: 'Физическое здоровье влияет на дух.', example: 'Занимайся спортом, в здоровом теле — здоровый дух.' },
  { type: 'proverb', text: 'В тихом омуте черти водятся.', meaning: 'Тихие люди бывают опасными.', example: 'Не доверяй ему, в тихом омуте черти водятся.' },
  { type: 'proverb', text: 'В чужой монастырь со своим уставом не ходят.', meaning: 'Уважай чужие правила.', example: 'Не лезь со своими советами, в чужой монастырь со своим уставом не ходят.' },
  { type: 'proverb', text: 'Век живи — век учись.', meaning: 'Учиться никогда не поздно.', example: 'Он и в 60 лет учится, век живи — век учись.' },
  { type: 'proverb', text: 'Всё хорошо, что хорошо кончается.', meaning: 'Главное — хороший финал.', example: 'Забыли обиды, всё хорошо, что хорошо кончается.' },
  { type: 'proverb', text: 'Всяк сверчок знай свой шесток.', meaning: 'Знай своё место.', example: 'Не лезь не в своё дело, всяк сверчок знай свой шесток.' },
  { type: 'proverb', text: 'Где родился, там и пригодился.', meaning: 'Родина важна.', example: 'Он вернулся домой, где родился, там и пригодился.' },
  { type: 'proverb', text: 'Голод не тётка.', meaning: 'Голод заставит.', example: 'Съел нелюбимую еду, голод не тётка.' },
  { type: 'proverb', text: 'Гора с горой не сходится, а человек с человеком сойдётся.', meaning: 'Люди встречаются.', example: 'Не прощайся, гора с горой не сходится.' },
  { type: 'proverb', text: 'Два медведя в одной берлоге не живут.', meaning: 'Два лидера не уживутся.', example: 'Не смогут они вместе работать, два медведя в одной берлоге не живут.' },
  { type: 'proverb', text: 'Дело мастера боится.', meaning: 'Опытный справится.', example: 'Не бойся, дело мастера боится.' },
  { type: 'proverb', text: 'Для милого дружка и серёжку из ушка.', meaning: 'Для друга ничего не жалко.', example: 'Он отдал всё, для милого дружка и серёжку из ушка.' },
  { type: 'proverb', text: 'Долг платежом красен.', meaning: 'Долг возвращают.', example: 'Верни деньги, долг платежом красен.' },
  { type: 'proverb', text: 'Дружба дружбой, а служба службой.', meaning: 'Работа и личные отношения — разное.', example: 'На работе мы коллеги, дружба дружбой, а служба службой.' },
  { type: 'proverb', text: 'Дураков не сеют, не жнут, сами родятся.', meaning: 'Глупость неискоренима.', example: 'Не спорь с ним, дураков не сеют, не жнут, сами родятся.' },
  { type: 'proverb', text: 'Ешь пирог с грибами, а язык держи за зубами.', meaning: 'Умей молчать.', example: 'Помни, ешь пирог с грибами, а язык держи за зубами.' },
  { type: 'proverb', text: 'Жизнь дана на добрые дела.', meaning: 'Живи для добра.', example: 'Помогай другим, жизнь дана на добрые дела.' },
  { type: 'proverb', text: 'За одного битого двух небитых дают.', meaning: 'Опыт ценен.', example: 'Он многое пережил, за одного битого двух небитых дают.' },
  { type: 'proverb', text: 'Знал бы, где упасть, соломки бы подстелил.', meaning: 'О непредвиденном.', example: 'Если бы знал, где упасть, соломки бы подстелил.' },
  { type: 'proverb', text: 'И волки сыты, и овцы целы.', meaning: 'Все довольны.', example: 'Нашли решение, и волки сыты, и овцы целы.' },
  { type: 'proverb', text: 'Из двух зол выбирают меньшее.', meaning: 'Выбирают лучшее из плохого.', example: 'Пришлось выбирать, из двух зол выбирают меньшее.' },
  { type: 'proverb', text: 'Как аукнется, так и откликнется.', meaning: 'Как ты, так и к тебе.', example: 'Помогай, как аукнется, так и откликнется.' },
  { type: 'proverb', text: 'Каков вопрос, таков и ответ.', meaning: 'Ответ зависит от вопроса.', example: 'Задал глупый вопрос, каков вопрос, таков и ответ.' },
  { type: 'proverb', text: 'Клин клином вышибают.', meaning: 'Противодействие.', example: 'Лечится клин клином вышибают.' },
  { type: 'proverb', text: 'Кому много дано, с того много и спросится.', meaning: 'С талантливых больше спрос.', example: 'Ты способный, кому много дано, с того много и спросится.' },
  { type: 'proverb', text: 'Кончил дело — гуляй смело.', meaning: 'Сделал — отдыхай.', example: 'Сделай уроки, кончил дело — гуляй смело.' },
  { type: 'proverb', text: 'Копейка рубль бережёт.', meaning: 'Экономия важна.', example: 'Не трать, копейка рубль бережёт.' },
  { type: 'proverb', text: 'Красна птица пером, а человек умом.', meaning: 'Ум важнее.', example: 'Не смотри на внешность, красна птица пером, а человек умом.' },
  { type: 'proverb', text: 'Крепок телом — богат и делом.', meaning: 'Здоровье помогает.', example: 'Занимайся, крепок телом — богат и делом.' },
  { type: 'proverb', text: 'Кто не работает, тот не ест.', meaning: 'Труд — основа.', example: 'Ничего не получишь, кто не работает, тот не ест.' },

  { type: 'proverb', text: 'Куй железо, пока горячо.', meaning: 'Действуй вовремя.', example: 'Куй железо, пока горячо.' },
  { type: 'proverb', text: 'Лес рубят — щепки летят.', meaning: 'Без жертв не бывает.', example: 'Пришлось уволить, лес рубят — щепки летят.' },
  { type: 'proverb', text: 'Любишь кататься — люби и саночки возить.', meaning: 'За удовольствие плати.', example: 'Любишь кататься — люби и саночки возить.' },
  { type: 'proverb', text: 'Мал золотник, да дорог.', meaning: 'Маленькое, но ценное.', example: 'Мал золотник, да дорог.' },
  { type: 'proverb', text: 'Много будешь знать — скоро состаришься.', meaning: 'Не лезь в чужие дела.', example: 'Не спрашивай, много будешь знать — скоро состаришься.' },
  { type: 'proverb', text: 'Москва слезам не верит.', meaning: 'Жалость не поможет.', example: 'Действуй, Москва слезам не верит.' },
  { type: 'proverb', text: 'На безрыбье и рак рыба.', meaning: 'Довольствуйся малым.', example: 'Соглашайся, на безрыбье и рак рыба.' },
  { type: 'proverb', text: 'На Бога надейся, а сам не плошай.', meaning: 'Не полагайся только на удачу.', example: 'Действуй, на Бога надейся, а сам не плошай.' },
  { type: 'proverb', text: 'На вкус и цвет товарищей нет.', meaning: 'У каждого свой вкус.', example: 'Не спорь, на вкус и цвет товарищей нет.' },
  { type: 'proverb', text: 'На ловца и зверь бежит.', meaning: 'Кто ищет, находит.', example: 'Он быстро нашёл, на ловца и зверь бежит.' },
  { type: 'proverb', text: 'На чужой каравай рот не разевай.', meaning: 'Не претендуй на чужое.', example: 'Не трогай, на чужой каравай рот не разевай.' },
  { type: 'proverb', text: 'Не было бы счастья, да несчастье помогло.', meaning: 'Беда привела к удаче.', example: 'Он потерял работу, но нашёл лучше, не было бы счастья, да несчастье помогло.' },
  { type: 'proverb', text: 'Не всё коту масленица.', meaning: 'Не всегда праздник.', example: 'Придётся потрудиться, не всё коту масленица.' },
  { type: 'proverb', text: 'Не имей сто рублей, а имей сто друзей.', meaning: 'Дружба важнее.', example: 'Обзаведись друзьями, не имей сто рублей, а имей сто друзей.' },
  { type: 'proverb', text: 'Не клади яйца в одну корзину.', meaning: 'Не рискуй всем.', example: 'Инвестируй, не клади яйца в одну корзину.' },
  { type: 'proverb', text: 'Не откладывай на завтра то, что можно сделать сегодня.', meaning: 'Делай сразу.', example: 'Не ленись, не откладывай на завтра.' },
  { type: 'proverb', text: 'Не плюй в колодец — пригодится воды напиться.', meaning: 'Не порть отношения.', example: 'Будь вежлив, не плюй в колодец.' },
  { type: 'proverb', text: 'Не рой другому яму, сам в неё попадёшь.', meaning: 'Зло возвращается.', example: 'Не делай гадостей, не рой другому яму.' },
  { type: 'proverb', text: 'Не так страшен чёрт, как его малюют.', meaning: 'Не так страшно.', example: 'Не бойся, не так страшен чёрт.' },
  { type: 'proverb', text: 'Не хлебом единым жив человек.', meaning: 'Духовное важно.', example: 'Читай книги, не хлебом единым жив человек.' },
  { type: 'proverb', text: 'Нет дыма без огня.', meaning: 'Слухи имеют основу.', example: 'Если говорят, нет дыма без огня.' },
  { type: 'proverb', text: 'Нет худа без добра.', meaning: 'В плохом есть хорошее.', example: 'Не расстраивайся, нет худа без добра.' },
  { type: 'proverb', text: 'О вкусах не спорят.', meaning: 'У каждого свой вкус.', example: 'Мне не нравится, но о вкусах не спорят.' },
  { type: 'proverb', text: 'Один в поле не воин.', meaning: 'В одиночку трудно.', example: 'Зови на помощь, один в поле не воин.' },
  { type: 'proverb', text: 'Одна голова хорошо, а две лучше.', meaning: 'Совет помогает.', example: 'Посоветуемся, одна голова хорошо, а две лучше.' },
  { type: 'proverb', text: 'Одна ласточка весны не делает.', meaning: 'Один случай не решает.', example: 'Не радуйся раньше времени, одна ласточка весны не делает.' },
  { type: 'proverb', text: 'От добра добра не ищут.', meaning: 'Не ищи лучшего.', example: 'Не меняй, от добра добра не ищут.' },
  { type: 'proverb', text: 'От любви до ненависти один шаг.', meaning: 'Чувства переменчивы.', example: 'Они поссорились, от любви до ненависти один шаг.' },
  { type: 'proverb', text: 'Отольются кошке мышкины слёзки.', meaning: 'Наказание за обиды.', example: 'Он получит, отольются кошке мышкины слёзки.' },
  { type: 'proverb', text: 'Первый блин комом.', meaning: 'Начало бывает неудачным.', example: 'Не переживай, первый блин комом.' },
  { type: 'proverb', text: 'По одёжке встречают, по уму провожают.', meaning: 'Внешность обманчива.', example: 'Он невзрачный, но умный, по одёжке встречают, по уму провожают.' },
  { type: 'proverb', text: 'Повторение — мать учения.', meaning: 'Повторение помогает.', example: 'Учи, повторение — мать учения.' },
  { type: 'proverb', text: 'Под лежачий камень вода не течёт.', meaning: 'Бездействие не даст результата.', example: 'Действуй, под лежачий камень вода не течёт.' },
  { type: 'proverb', text: 'После дождичка в четверг.', meaning: 'Никогда.', example: 'Он обещает, но это после дождичка в четверг.' },
  { type: 'proverb', text: 'Поспешишь — людей насмешишь.', meaning: 'Спешка вредит.', example: 'Не торопись, поспешишь — людей насмешишь.' },
  { type: 'proverb', text: 'Правда глаза колет.', meaning: 'Правда неприятна.', example: 'Не обижайся, правда глаза колет.' },
  { type: 'proverb', text: 'Пришла беда — отворяй ворота.', meaning: 'Беды идут чередой.', example: 'Пришла беда — отворяй ворота.' },
  { type: 'proverb', text: 'Против лома нет приёма.', meaning: 'Против силы нет защиты.', example: 'С ним бесполезно, против лома нет приёма.' },
  { type: 'proverb', text: 'Пуганая ворона куста боится.', meaning: 'Обжёгшийся боится.', example: 'Он боится, пуганая ворона куста боится.' },
  { type: 'proverb', text: 'Работа не волк — в лес не убежит.', meaning: 'Работу можно отложить.', example: 'Не переживай, работа не волк.' },
  { type: 'proverb', text: 'Рыбак рыбака видит издалека.', meaning: 'Похожие находят друг друга.', example: 'Они быстро нашли общий язык, рыбак рыбака видит издалека.' },
  { type: 'proverb', text: 'С богатым не тянись, с нищим не знайся.', meaning: 'Знай своё место.', example: 'Не завидуй, с богатым не тянись.' },
  { type: 'proverb', text: 'С волками жить — по-волчьи выть.', meaning: 'Приспосабливайся.', example: 'Придётся подстроиться, с волками жить — по-волчьи выть.' },
  { type: 'proverb', text: 'С глаз долой — из сердца вон.', meaning: 'Забывается.', example: 'Он уехал, с глаз долой — из сердца вон.' },
  { type: 'proverb', text: 'С кем поведёшься, от того и наберёшься.', meaning: 'Окружение влияет.', example: 'Не общайся, с кем поведёшься, от того и наберёшься.' },
  { type: 'proverb', text: 'С миру по нитке — голому рубаха.', meaning: 'Помощь понемногу.', example: 'Соберём, с миру по нитке — голому рубаха.' },
  { type: 'proverb', text: 'С одного дерева да разные плоды.', meaning: 'Люди разные.', example: 'Братья разные, с одного дерева да разные плоды.' },
  { type: 'proverb', text: 'С паршивой овцы хоть шерсти клок.', meaning: 'Хоть какая-то польза.', example: 'Даже с него польза, с паршивой овцы хоть шерсти клок.' },
  { type: 'proverb', text: 'Сбоку припёка.', meaning: 'Лишний.', example: 'Я здесь сбоку припёка.' },
  { type: 'proverb', text: 'Своя ноша не тянет.', meaning: 'Своё не в тягость.', example: 'Он несёт, своя ноша не тянет.' },
  { type: 'proverb', text: 'Своя рубашка ближе к телу.', meaning: 'Свои интересы важнее.', example: 'Он думает о себе, своя рубашка ближе к телу.' },
  { type: 'proverb', text: 'Сделал дело — гуляй смело.', meaning: 'Закончил — отдыхай.', example: 'Сделай уроки, сделал дело — гуляй смело.' },
  { type: 'proverb', text: 'Семеро одного не ждут.', meaning: 'Нельзя задерживать.', example: 'Пойдёмте, семеро одного не ждут.' },
  { type: 'proverb', text: 'Сердце не камень.', meaning: 'Способен чувствовать.', example: 'Он не злой, сердце не камень.' },
  { type: 'proverb', text: 'Сколько голов, столько умов.', meaning: 'У каждого своё мнение.', example: 'Не спорьте, сколько голов, столько умов.' },
  { type: 'proverb', text: 'Слезами горю не поможешь.', meaning: 'Плач не решает проблем.', example: 'Не плачь, слезами горю не поможешь.' },
  { type: 'proverb', text: 'Слово не воробей, вылетит — не поймаешь.', meaning: 'Следи за словами.', example: 'Подумай, слово не воробей.' },
  { type: 'proverb', text: 'Слухом земля полнится.', meaning: 'Слухи распространяются.', example: 'Не говори, слухом земля полнится.' },
  { type: 'proverb', text: 'Смелость города берёт.', meaning: 'Смелость помогает побеждать.', example: 'Действуй, смелость города берёт.' },
  { type: 'proverb', text: 'Сначала подумай, потом говори.', meaning: 'Думай перед словами.', example: 'Сначала подумай, потом говори.' },
  { type: 'proverb', text: 'Собака лает — ветер носит.', meaning: 'Не обращай внимания на слухи.', example: 'Не слушай, собака лает — ветер носит.' },
  { type: 'proverb', text: 'Соловья баснями не кормят.', meaning: 'Слова не заменят дела.', example: 'Хватит говорить, соловья баснями не кормят.' },
  { type: 'proverb', text: 'Сорока на хвосте принесла.', meaning: 'Неизвестно откуда узнали.', example: 'Откуда ты знаешь? Сорока на хвосте принесла.' },
  { type: 'proverb', text: 'Спасибо этому дому, пойдём к другому.', meaning: 'Пора уходить.', example: 'Ну что ж, спасибо этому дому, пойдём к другому.' },
  { type: 'proverb', text: 'Старый друг лучше новых двух.', meaning: 'Старые друзья ценнее.', example: 'Не забывай старых друзей, старый друг лучше новых двух.' },
  { type: 'proverb', text: 'Стерпится — слюбится.', meaning: 'Привыкнешь.', example: 'Не переживай, стерпится — слюбится.' },
  { type: 'proverb', text: 'Сто раз отмерь, один раз отрежь.', meaning: 'Думай перед действием.', example: 'Не спеши, сто раз отмерь, один раз отрежь.' },
  { type: 'proverb', text: 'Стыд не дым, глаза не выест.', meaning: 'Стыд можно пережить.', example: 'Не бойся, стыд не дым, глаза не выест.' },
  { type: 'proverb', text: 'Судьба играет человеком.', meaning: 'Жизнь переменчива.', example: 'Судьба играет человеком, будь готов ко всему.' },
  { type: 'proverb', text: 'Счастье не в деньгах.', meaning: 'Счастье не в богатстве.', example: 'Не гонись за деньгами, счастье не в деньгах.' },
  { type: 'proverb', text: 'Счастье не конь, хомута не наденешь.', meaning: 'Счастье не удержать.', example: 'Счастье не конь, хомута не наденешь.' },
  { type: 'proverb', text: 'Съесть-то пуд соли.', meaning: 'Много пережить вместе.', example: 'Они вместе пуд соли съели.' },
  { type: 'proverb', text: 'Сытый голодного не разумеет.', meaning: 'Сытый не поймёт голодного.', example: 'Не объясняй, сытый голодного не разумеет.' },
  { type: 'proverb', text: 'Терпение и труд всё перетрут.', meaning: 'Терпение и труд побеждают.', example: 'Не сдавайся, терпение и труд всё перетрут.' },
  { type: 'proverb', text: 'Тихая вода берега подмывает.', meaning: 'Тихие люди хитры.', example: 'Не доверяй, тихая вода берега подмывает.' },
  { type: 'proverb', text: 'Тише едешь — дальше будешь.', meaning: 'Не торопись.', example: 'Не гони, тише едешь — дальше будешь.' },
  { type: 'proverb', text: 'Толочь воду в ступе.', meaning: 'Бесполезно.', example: 'Хватит толочь воду в ступе.' },
  { type: 'proverb', text: 'Тому не бывать, что не должно статься.', meaning: 'Всё будет как должно.', example: 'Тому не бывать, что не должно статься.' },
  { type: 'proverb', text: 'Тот не ошибается, кто ничего не делает.', meaning: 'Ошибки — часть дела.', example: 'Не бойся, тот не ошибается, кто ничего не делает.' },
  { type: 'proverb', text: 'Трудно в учении — легко в бою.', meaning: 'Трудности учёбы окупятся.', example: 'Учись, трудно в учении — легко в бою.' },
  { type: 'proverb', text: 'Ты мне друг, но истина дороже.', meaning: 'Правда важнее.', example: 'Извини, ты мне друг, но истина дороже.' },
  { type: 'proverb', text: 'У кого что болит, тот о том и говорит.', meaning: 'Говорит о своём.', example: 'Он о работе, у кого что болит, тот о том и говорит.' },
  { type: 'proverb', text: 'У семи нянек дитя без глазу.', meaning: 'Много контроля — плохо.', example: 'Не вмешивайтесь, у семи нянек дитя без глазу.' },
  { type: 'proverb', text: 'У страха глаза велики.', meaning: 'Страх преувеличивает.', example: 'Не бойся, у страха глаза велики.' },
  { type: 'proverb', text: 'Утопающий и за соломинку хватается.', meaning: 'В опасности используют всё.', example: 'Он был готов на всё, утопающий и за соломинку хватается.' },
  { type: 'proverb', text: 'Утро вечера мудренее.', meaning: 'Утром лучше.', example: 'Ложись, утро вечера мудренее.' },
  { type: 'proverb', text: 'Хлеб — всему голова.', meaning: 'Еда — основа.', example: 'Не выбрасывай, хлеб — всему голова.' },
  { type: 'proverb', text: 'Хорошо смеётся тот, кто смеётся последним.', meaning: 'Победа важнее.', example: 'Не радуйся, хорошо смеётся тот, кто смеётся последним.' },
  { type: 'proverb', text: 'Хочешь мира — готовься к войне.', meaning: 'Готовься к защите.', example: 'Будь сильным, хочешь мира — готовься к войне.' },
  { type: 'proverb', text: 'Цыплят по осени считают.', meaning: 'О результате по завершении.', example: 'Не хвались, цыплят по осени считают.' },
  { type: 'proverb', text: 'Чем дальше в лес, тем больше дров.', meaning: 'Чем глубже, тем сложнее.', example: 'Разбираться, чем дальше в лес, тем больше дров.' },
  { type: 'proverb', text: 'Что написано пером — не вырубишь топором.', meaning: 'Написанное имеет силу.', example: 'Подписал, что написано пером — не вырубишь топором.' },
  { type: 'proverb', text: 'Что посеешь, то и пожнёшь.', meaning: 'Как поступишь, так и получишь.', example: 'Помогай, что посеешь, то и пожнёшь.' },
  { type: 'proverb', text: 'Чужая душа — потёмки.', meaning: 'Трудно понять другого.', example: 'Не угадаешь, чужая душа — потёмки.' },
  { type: 'proverb', text: 'Шила в мешке не утаишь.', meaning: 'Секрет раскроется.', example: 'Не ври, шила в мешке не утаишь.' },
  { type: 'proverb', text: 'Щи да каша — пища наша.', meaning: 'Простая еда.', example: 'Нам много не надо, щи да каша — пища наша.' },
  { type: 'proverb', text: 'Это ещё цветочки, а ягодки впереди.', meaning: 'Трудности впереди.', example: 'Не расслабляйся, это ещё цветочки.' },
  { type: 'proverb', text: 'Яблоко от яблони недалеко падает.', meaning: 'Дети похожи на родителей.', example: 'Он в отца, яблоко от яблони недалеко падает.' },
  { type: 'proverb', text: 'Язык до Киева доведёт.', meaning: 'Спрашивая, найдёшь.', example: 'Не бойся спрашивать, язык до Киева доведёт.' },
  // --- МАКСИМЫ И АФОРИЗМЫ (200+ штук) ---
  { type: 'quote', text: 'Я знаю только то, что ничего не знаю.', meaning: 'Осознание своего невежества — начало мудрости.', author: 'Сократ', example: 'Античная философия' },
  { type: 'quote', text: 'Человек — мера всех вещей.', meaning: 'Мир познается через человека.', author: 'Протагор', example: 'Философия' },
  { type: 'quote', text: 'Всё течёт, всё меняется.', meaning: 'Мир в постоянном движении.', author: 'Гераклит', example: 'Философия' },
  { type: 'quote', text: 'Нельзя дважды войти в одну и ту же реку.', meaning: 'Жизнь не стоит на месте.', author: 'Гераклит', example: 'Философия' },
  { type: 'quote', text: 'Познай самого себя.', meaning: 'Самопознание — ключ к мудрости.', author: 'Сократ', example: 'Надпись в Дельфах' },
  { type: 'quote', text: 'Свобода — это осознанная необходимость.', meaning: 'Понимание законов мира делает нас свободными.', author: 'Гегель', example: 'Философия права' },
  { type: 'quote', text: 'Я мыслю, следовательно, я существую.', meaning: 'Мысль — доказательство бытия.', author: 'Декарт', example: 'Философия' },
  { type: 'quote', text: 'Человек — это то, что он делает из себя.', meaning: 'Мы сами творим свою жизнь.', author: 'Сартр', example: 'Экзистенциализм' },
  { type: 'quote', text: 'Жизнь — это то, что происходит с тобой, пока ты строишь другие планы.', meaning: 'Цените настоящий момент.', author: 'Джон Леннон', example: 'Песня' },
  { type: 'quote', text: 'Всё, что нас не убивает, делает нас сильнее.', meaning: 'Трудности закаляют.', author: 'Ницше', example: 'Философия' },
  { type: 'quote', text: 'Красота спасёт мир.', meaning: 'Искусство преобразит человечество.', author: 'Достоевский', example: '«Идиот»' },
  { type: 'quote', text: 'В человеке всё должно быть прекрасно.', meaning: 'Гармония внешнего и внутреннего.', author: 'Чехов', example: '«Дядя Ваня»' },
  { type: 'quote', text: 'Гений — это один процент вдохновения и девяносто девять процентов пота.', meaning: 'Труд важнее таланта.', author: 'Эдисон', example: 'Изобретения' },
  { type: 'quote', text: 'Знание — сила.', meaning: 'Информация — это власть.', author: 'Бэкон', example: 'Научная революция' },
  { type: 'quote', text: 'Умный не тот, кто много говорит, а тот, кто много знает.', meaning: 'Ценность в знаниях.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Хочешь быть счастливым — будь им.', meaning: 'Счастье в наших руках.', author: 'Козьма Прутков', example: 'Афоризм' },
  { type: 'quote', text: 'Цель жизни — жить, а не существовать.', meaning: 'Жизнь должна быть наполнена смыслом.', author: 'Джек Лондон', example: 'Книга' },
  { type: 'quote', text: 'Человек, который не мечтает, — не живёт.', meaning: 'Мечты двигают вперёд.', author: 'Из фильма', example: 'Кино' },
  { type: 'quote', text: 'Что имеем — не храним, потерявши — плачем.', meaning: 'Цените то, что есть.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Шила в мешке не утаишь.', meaning: 'Правда всегда выйдет.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Юмор — это спасательный круг на волнах жизни.', meaning: 'Юмор помогает жить.', author: 'Вильгельм Рабе', example: 'Афоризм' },
  { type: 'quote', text: 'Я не знаю, каким оружием будет вестись Третья мировая война, но Четвертая — камнями и палками.', meaning: 'Опасность ядерной войны.', author: 'Эйнштейн', example: 'Интервью' },
  { type: 'quote', text: 'Умный учится на чужих ошибках, а дурак — на своих.', meaning: 'Опыт других бесценен.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Без труда не вытащишь и рыбку из пруда.', meaning: 'Всё требует усилий.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Семь раз отмерь, один раз отрежь.', meaning: 'Думай перед действием.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Не рой другому яму, сам в неё попадёшь.', meaning: 'Зло возвращается.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Слово не воробей, вылетит — не поймаешь.', meaning: 'Следи за словами.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Тише едешь — дальше будешь.', meaning: 'Не торопись.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Волков бояться — в лес не ходить.', meaning: 'Не бойся трудностей.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Глаза боятся, а руки делают.', meaning: 'Страшно только сначала.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Делу время, потехе час.', meaning: 'Работа важнее развлечений.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'За двумя зайцами погонишься — ни одного не поймаешь.', meaning: 'Не берись за всё сразу.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Куй железо, пока горячо.', meaning: 'Действуй вовремя.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Лучше синица в руках, чем журавль в небе.', meaning: 'Лучше реальное, чем мечта.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Не всё то золото, что блестит.', meaning: 'Внешность обманчива.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Один в поле не воин.', meaning: 'В одиночку трудно.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Повторение — мать учения.', meaning: 'Повторение помогает.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Сделал дело — гуляй смело.', meaning: 'Отдыхай после работы.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Терпение и труд всё перетрут.', meaning: 'Терпение побеждает.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Утро вечера мудренее.', meaning: 'Утром лучше.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Хлеб — всему голова.', meaning: 'Еда — основа.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Цыплят по осени считают.', meaning: 'О результате судят по завершении.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Яблоко от яблони недалеко падает.', meaning: 'Дети похожи на родителей.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Язык до Киева доведёт.', meaning: 'Спрашивая, найдёшь.', author: 'Народная мудрость', example: 'Пословица' },
  { type: 'quote', text: 'Аппетит приходит во время еды.', meaning: 'Интерес появляется в процессе.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Бережёного Бог бережёт.', meaning: 'Осторожность важна.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Близок локоток, да не укусишь.', meaning: 'Близко, но недоступно.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Была бы шея, а хомут найдётся.', meaning: 'Работа найдётся.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'В гостях хорошо, а дома лучше.', meaning: 'Дом — лучшее место.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'В тихом омуте черти водятся.', meaning: 'Тихие люди хитры.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Век живи — век учись.', meaning: 'Учиться никогда не поздно.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Всё хорошо, что хорошо кончается.', meaning: 'Главное — результат.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Всяк сверчок знай свой шесток.', meaning: 'Знай своё место.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Где родился, там и пригодился.', meaning: 'Родина важна.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Голод не тётка.', meaning: 'Голод заставит.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Гора с горой не сходится, а человек с человеком сойдётся.', meaning: 'Люди встречаются.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Два медведя в одной берлоге не живут.', meaning: 'Два лидера не уживутся.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Дело мастера боится.', meaning: 'Опытный справится.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Для милого дружка и серёжку из ушка.', meaning: 'Для друга ничего не жалко.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Долг платежом красен.', meaning: 'Долг возвращают.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Дружба дружбой, а служба службой.', meaning: 'Работа и личное — разное.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Ешь пирог с грибами, а язык держи за зубами.', meaning: 'Умей молчать.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Жизнь дана на добрые дела.', meaning: 'Живи для добра.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'За одного битого двух небитых дают.', meaning: 'Опыт ценен.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Знал бы, где упасть, соломки бы подстелил.', meaning: 'О непредвиденном.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'И волки сыты, и овцы целы.', meaning: 'Все довольны.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Из двух зол выбирают меньшее.', meaning: 'Выбирают лучшее из плохого.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Как аукнется, так и откликнется.', meaning: 'Как ты, так и к тебе.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Каков вопрос, таков и ответ.', meaning: 'Ответ зависит от вопроса.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Клин клином вышибают.', meaning: 'Противодействие.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Кому много дано, с того много и спросится.', meaning: 'С талантливых больше спрос.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Кончил дело — гуляй смело.', meaning: 'Сделал — отдыхай.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Копейка рубль бережёт.', meaning: 'Экономия важна.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Красна птица пером, а человек умом.', meaning: 'Ум важнее.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Крепок телом — богат и делом.', meaning: 'Здоровье помогает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Кто не работает, тот не ест.', meaning: 'Труд — основа.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Кто рано встаёт, тому Бог подаёт.', meaning: 'Трудолюбие вознаграждается.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Куй железо, пока горячо.', meaning: 'Действуй вовремя.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Лес рубят — щепки летят.', meaning: 'Без жертв не бывает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Любишь кататься — люби и саночки возить.', meaning: 'За удовольствие плати.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Мал золотник, да дорог.', meaning: 'Маленькое, но ценное.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Много будешь знать — скоро состаришься.', meaning: 'Не лезь в чужие дела.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Москва слезам не верит.', meaning: 'Жалость не поможет.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'На безрыбье и рак рыба.', meaning: 'Довольствуйся малым.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'На Бога надейся, а сам не плошай.', meaning: 'Не полагайся только на удачу.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'На вкус и цвет товарищей нет.', meaning: 'У каждого свой вкус.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'На ловца и зверь бежит.', meaning: 'Кто ищет, находит.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'На чужой каравай рот не разевай.', meaning: 'Не претендуй на чужое.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не было бы счастья, да несчастье помогло.', meaning: 'Беда привела к удаче.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не всё коту масленица.', meaning: 'Не всегда праздник.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не имей сто рублей, а имей сто друзей.', meaning: 'Дружба важнее.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не клади яйца в одну корзину.', meaning: 'Не рискуй всем.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не откладывай на завтра то, что можно сделать сегодня.', meaning: 'Делай сразу.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не плюй в колодец — пригодится воды напиться.', meaning: 'Не порть отношения.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не рой другому яму, сам в неё попадёшь.', meaning: 'Зло возвращается.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не так страшен чёрт, как его малюют.', meaning: 'Не так страшно.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Не хлебом единым жив человек.', meaning: 'Духовное важно.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Нет дыма без огня.', meaning: 'Слухи имеют основу.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Нет худа без добра.', meaning: 'В плохом есть хорошее.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'О вкусах не спорят.', meaning: 'У каждого свой вкус.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Один в поле не воин.', meaning: 'В одиночку трудно.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Одна голова хорошо, а две лучше.', meaning: 'Совет помогает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Одна ласточка весны не делает.', meaning: 'Один случай не решает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'От добра добра не ищут.', meaning: 'Не ищи лучшего.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'От любви до ненависти один шаг.', meaning: 'Чувства переменчивы.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Отольются кошке мышкины слёзки.', meaning: 'Наказание за обиды.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Первый блин комом.', meaning: 'Начало бывает неудачным.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'По одёжке встречают, по уму провожают.', meaning: 'Внешность обманчива.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Повторение — мать учения.', meaning: 'Повторение помогает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Под лежачий камень вода не течёт.', meaning: 'Бездействие не даст результата.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'После дождичка в четверг.', meaning: 'Никогда.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Поспешишь — людей насмешишь.', meaning: 'Спешка вредит.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Правда глаза колет.', meaning: 'Правда неприятна.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Пришла беда — отворяй ворота.', meaning: 'Беды идут чередой.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Против лома нет приёма.', meaning: 'Против силы нет защиты.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Пуганая ворона куста боится.', meaning: 'Обжёгшийся боится.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Работа не волк — в лес не убежит.', meaning: 'Работу можно отложить.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Рыбак рыбака видит издалека.', meaning: 'Похожие находят друг друга.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'С богатым не тянись, с нищим не знайся.', meaning: 'Знай своё место.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'С волками жить — по-волчьи выть.', meaning: 'Приспосабливайся.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'С глаз долой — из сердца вон.', meaning: 'Забывается.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'С кем поведёшься, от того и наберёшься.', meaning: 'Окружение влияет.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'С миру по нитке — голому рубаха.', meaning: 'Помощь понемногу.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'С одного дерева да разные плоды.', meaning: 'Люди разные.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'С паршивой овцы хоть шерсти клок.', meaning: 'Хоть какая-то польза.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Сбоку припёка.', meaning: 'Лишний.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Своя ноша не тянет.', meaning: 'Своё не в тягость.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Своя рубашка ближе к телу.', meaning: 'Свои интересы важнее.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Сделал дело — гуляй смело.', meaning: 'Закончил — отдыхай.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Семеро одного не ждут.', meaning: 'Нельзя задерживать.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Сердце не камень.', meaning: 'Способен чувствовать.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Сколько голов, столько умов.', meaning: 'У каждого своё мнение.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Слезами горю не поможешь.', meaning: 'Плач не решает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Слово не воробей, вылетит — не поймаешь.', meaning: 'Следи за словами.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Слухом земля полнится.', meaning: 'Слухи распространяются.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Смелость города берёт.', meaning: 'Смелость помогает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Сначала подумай, потом говори.', meaning: 'Думай перед словами.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Собака лает — ветер носит.', meaning: 'Не обращай внимания.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Соловья баснями не кормят.', meaning: 'Слова не заменят дела.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Сорока на хвосте принесла.', meaning: 'Неизвестно откуда.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Спасибо этому дому, пойдём к другому.', meaning: 'Пора уходить.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Старый друг лучше новых двух.', meaning: 'Старые друзья ценнее.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Стерпится — слюбится.', meaning: 'Привыкнешь.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Сто раз отмерь, один раз отрежь.', meaning: 'Думай перед действием.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Стыд не дым, глаза не выест.', meaning: 'Стыд можно пережить.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Судьба играет человеком.', meaning: 'Жизнь переменчива.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Счастье не в деньгах.', meaning: 'Счастье не в богатстве.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Счастье не конь, хомута не наденешь.', meaning: 'Счастье не удержать.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Съесть-то пуд соли.', meaning: 'Много пережить.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Сытый голодного не разумеет.', meaning: 'Сытый не поймёт голодного.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Терпение и труд всё перетрут.', meaning: 'Терпение побеждает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Тихая вода берега подмывает.', meaning: 'Тихие люди хитры.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Тише едешь — дальше будешь.', meaning: 'Не торопись.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Толочь воду в ступе.', meaning: 'Бесполезно.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Тому не бывать, что не должно статься.', meaning: 'Всё будет как должно.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Тот не ошибается, кто ничего не делает.', meaning: 'Ошибки — часть дела.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Трудно в учении — легко в бою.', meaning: 'Трудности окупятся.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Ты мне друг, но истина дороже.', meaning: 'Правда важнее.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'У кого что болит, тот о том и говорит.', meaning: 'Говорит о своём.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'У семи нянек дитя без глазу.', meaning: 'Много контроля — плохо.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'У страха глаза велики.', meaning: 'Страх преувеличивает.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Утопающий и за соломинку хватается.', meaning: 'В опасности используют всё.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Утро вечера мудренее.', meaning: 'Утром лучше.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Хлеб — всему голова.', meaning: 'Еда — основа.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Хорошо смеётся тот, кто смеётся последним.', meaning: 'Победа важнее.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Хочешь мира — готовься к войне.', meaning: 'Готовься к защите.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Цыплят по осени считают.', meaning: 'О результате по завершении.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Чем дальше в лес, тем больше дров.', meaning: 'Чем глубже, тем сложнее.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Что написано пером — не вырубишь топором.', meaning: 'Написанное имеет силу.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Что посеешь, то и пожнёшь.', meaning: 'Как поступишь, так и получишь.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Чужая душа — потёмки.', meaning: 'Трудно понять другого.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Шила в мешке не утаишь.', meaning: 'Секрет раскроется.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Щи да каша — пища наша.', meaning: 'Простая еда.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Это ещё цветочки, а ягодки впереди.', meaning: 'Трудности впереди.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Яблоко от яблони недалеко падает.', meaning: 'Дети похожи на родителей.', author: 'Народная мудрость', example: 'Поговорка' },
  { type: 'quote', text: 'Язык до Киева доведёт.', meaning: 'Спрашивая, найдёшь.', author: 'Народная мудрость', example: 'Поговорка' },
  // --- ВЕЛИКИЕ ЦИТАТЫ (150 штук) ---
  { type: 'quote', text: 'Я знаю только то, что ничего не знаю.', meaning: 'Осознание своего невежества — начало мудрости.', author: 'Сократ', example: 'Античная философия' },
  { type: 'quote', text: 'Всё течёт, всё меняется.', meaning: 'Мир в постоянном движении.', author: 'Гераклит', example: 'Философия' },
  { type: 'quote', text: 'Человек — мера всех вещей.', meaning: 'Мир познается через человека.', author: 'Протагор', example: 'Философия' },
  { type: 'quote', text: 'Я мыслю, следовательно, я существую.', meaning: 'Мысль — доказательство бытия.', author: 'Рене Декарт', example: 'Философия' },
  { type: 'quote', text: 'Свобода — это осознанная необходимость.', meaning: 'Понимание законов мира делает нас свободными.', author: 'Георг Гегель', example: 'Философия права' },
  { type: 'quote', text: 'Человек — это то, что он делает из себя.', meaning: 'Мы сами творим свою жизнь.', author: 'Жан-Поль Сартр', example: 'Экзистенциализм' },
  { type: 'quote', text: 'Жизнь — это то, что происходит с тобой, пока ты строишь другие планы.', meaning: 'Цените настоящий момент.', author: 'Джон Леннон', example: 'Песня' },
  { type: 'quote', text: 'Всё, что нас не убивает, делает нас сильнее.', meaning: 'Трудности закаляют.', author: 'Фридрих Ницше', example: 'Философия' },
  { type: 'quote', text: 'Красота спасёт мир.', meaning: 'Искусство преобразит человечество.', author: 'Фёдор Достоевский', example: '«Идиот»' },
  { type: 'quote', text: 'В человеке всё должно быть прекрасно.', meaning: 'Гармония внешнего и внутреннего.', author: 'Антон Чехов', example: '«Дядя Ваня»' },
  { type: 'quote', text: 'Гений — это один процент вдохновения и девяносто девять процентов пота.', meaning: 'Труд важнее таланта.', author: 'Томас Эдисон', example: 'Изобретения' },
  { type: 'quote', text: 'Знание — сила.', meaning: 'Информация — это власть.', author: 'Фрэнсис Бэкон', example: 'Научная революция' },
  { type: 'quote', text: 'Человек человеку волк.', meaning: 'О жестокости людей в борьбе за выживание.', author: 'Плавт', example: 'Римская комедия' },

  localStorage.setItem('pax_favorites', JSON.stringify(favorites));
}

function isFavorite(item) {
  return favorites.some(f => f.text === item.text);
}

function toggleFavorite() {
  if (!currentItem) return;
  if (isFavorite(currentItem)) {
    favorites = favorites.filter(f => f.text !== currentItem.text);
  } else {
    favorites.push(currentItem);
  }
  saveFavorites();
  updateFavButton();
  if (currentMode === 'fav') nextItem();
}

function updateFavButton() {
  const btn = document.getElementById('btnFav');
  if (currentItem && isFavorite(currentItem)) {
    btn.innerHTML = '💔 Удалить из избранного';
    btn.classList.add('active');
  } else {
    btn.innerHTML = '❤️ В избранное';
    btn.classList.remove('active');
  }
}

function updateFilter() {
  if (currentMode === 'all') filteredData = DATA;
  else if (currentMode === 'phrase') filteredData = DATA.filter(d => d.type === 'phrase');
  else if (currentMode === 'quote') filteredData = DATA.filter(d => d.type === 'quote');
  else if (currentMode === 'proverb') filteredData = DATA.filter(d => d.type === 'proverb');
  else if (currentMode === 'fav') filteredData = favorites;
}

function getRandomItem() {
  if (filteredData.length === 0) return null;
  return filteredData[Math.floor(Math.random() * filteredData.length)];
}

function nextItem() {
  updateFilter();
  const item = getRandomItem();
  
  const titleEl = document.getElementById('phraseTitle');
  const badgeEl = document.getElementById('typeBadge');
  const answerBlock = document.getElementById('answerBlock');
  const btnFav = document.getElementById('btnFav');

  if (!item) {
    titleEl.innerText = 'Здесь пока пусто.';
    answerBlock.style.display = 'none';
    badgeEl.innerText = '—';
    badgeEl.style.background = 'transparent';
    badgeEl.style.color = 'var(--muted)';
    document.getElementById('counterTag').innerText = '0 элементов';
    btnFav.style.display = 'none';
    return;
  }
  
  currentItem = item;
  btnFav.style.display = 'block';
  
  if (item.type === 'quote') {
    badgeEl.innerText = 'Цитата';
    badgeEl.style.color = 'var(--gold)';
    badgeEl.style.background = 'rgba(245,158,11,0.15)';
  } else if (item.type === 'proverb') {
    badgeEl.innerText = 'Пословица';
    badgeEl.style.color = 'var(--purple)';
    badgeEl.style.background = 'rgba(168,85,247,0.15)';
  } else {
    badgeEl.innerText = 'Фразеологизм';
    badgeEl.style.color = 'var(--accent)';
    badgeEl.style.background = 'rgba(59,130,246,0.15)';
  }

  titleEl.innerText = item.text;
  document.getElementById('meaningText').innerText = item.meaning;
  
  const authorEl = document.getElementById('authorText');
  if (item.type === 'quote' && item.author) {
    authorEl.innerText = '— ' + item.author;
    authorEl.style.display = 'block';
  } else {
    authorEl.style.display = 'none';
  }

  if (item.example) {
    document.getElementById('exampleText').innerText = item.example;
    document.getElementById('exampleBox').style.display = 'block';
  } else {
    document.getElementById('exampleBox').style.display = 'none';
  }

  answerBlock.style.display = 'none';
  document.getElementById('btnShow').style.display = 'block';
  
  updateFavButton();
  document.getElementById('counterTag').innerText = `Элементов: ${filteredData.length}`;
}

function showAnswer() {
  document.getElementById('answerBlock').style.display = 'block';
  document.getElementById('btnShow').style.display = 'none';
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  nextItem();
}
function searchItems() {
  let query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) {
    updateFilter();
    nextItem();
    return;
  }
  
  let found = DATA.filter(item => 
    item.text.toLowerCase().includes(query) || 
    item.meaning.toLowerCase().includes(query)
  );
  
  if (found.length === 0) {
    document.getElementById('phraseTitle').innerText = 'Ничего не найдено :(';
    document.getElementById('answerBlock').style.display = 'none';
    document.getElementById('btnShow').style.display = 'none';
    document.getElementById('counterTag').innerText = '0 результатов';
    return;
  }
  
  currentItem = found[Math.floor(Math.random() * found.length)];
  document.getElementById('phraseTitle').innerText = currentItem.text;
  document.getElementById('meaningText').innerText = currentItem.meaning;
  
  if (currentItem.author) {
    document.getElementById('authorText').innerText = '— ' + currentItem.author;
    document.getElementById('authorText').style.display = 'block';
  } else {
    document.getElementById('authorText').style.display = 'none';
  }
  
  if (currentItem.example) {
    document.getElementById('exampleText').innerText = currentItem.example;
    document.getElementById('exampleBox').style.display = 'block';
  } else {
    document.getElementById('exampleBox').style.display = 'none';
  }
  
  document.getElementById('answerBlock').style.display = 'block';
  document.getElementById('btnShow').style.display = 'none';
  document.getElementById('counterTag').innerText = 'Найдено: ' + found.length;
}
  function exportFavorites() {
  if (favorites.length === 0) {
    alert('У вас пока нет избранных фразеологизмов!');
    return;
  }
  
  let text = "МОИ ИЗБРАННЫЕ ФРАЗЕОЛОГИЗМЫ И ЦИТАТЫ:\n\n";
  favorites.forEach((item, index) => {
    text += (index + 1) + ". " + item.text + "\n";
    text += "Значение: " + item.meaning + "\n";
    if (item.author) text += "Автор: " + item.author + "\n";
    if (item.example) text += "Пример: " + item.example + "\n";
    text += "-------------------\n";
  });
  
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Мое_избранное_Слово_дня.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
  // === ВИКТОРИНА ===
let quizTimer = null;
let quizTimeLeft = 25; // 25 СЕКУНД
let quizCurrentScore = 0;
let quizCurrentItem = null;
let quizPool = [];

function startQuiz() {
  document.getElementById('quizModal').style.display = 'flex';
  document.getElementById('quizTitle').innerText = '⏱️ Викторина: 25 секунд';
  document.getElementById('quizTimer').innerText = '25';
  document.getElementById('quizScore').innerText = '0';
  document.getElementById('quizQuestion').innerText = 'Нажмите «Начать игру»';
  document.getElementById('quizOptions').innerHTML = '';
  document.getElementById('quizStartBtn').style.display = 'block';
  document.getElementById('quizCloseBtn').style.display = 'none';
}

function closeQuiz() {
  document.getElementById('quizModal').style.display = 'none';
  if (quizTimer) clearInterval(quizTimer);
}

function startQuizGame() {
  quizTimeLeft = 25;
  quizCurrentScore = 0;
  quizPool = DATA.filter(d => d.type === 'phrase' && d.example);
  document.getElementById('quizStartBtn').style.display = 'none';
  document.getElementById('quizCloseBtn').style.display = 'block';
  document.getElementById('quizScore').innerText = '0';
  
  quizTimer = setInterval(() => {
    quizTimeLeft--;
    document.getElementById('quizTimer').innerText = quizTimeLeft;
    if (quizTimeLeft <= 0) { clearInterval(quizTimer); endQuiz(); }
  }, 1000);
  
  nextQuizQuestion();
}

function nextQuizQuestion() {
  if (quizTimeLeft <= 0) return;
  quizCurrentItem = quizPool[Math.floor(Math.random() * quizPool.length)];
  document.getElementById('quizQuestion').innerText = quizCurrentItem.text;
  
  let wrongOptions = [];
  while (wrongOptions.length < 3) {
    let rand = quizPool[Math.floor(Math.random() * quizPool.length)];
    if (rand.meaning !== quizCurrentItem.meaning && !wrongOptions.includes(rand.meaning)) {
      wrongOptions.push(rand.meaning);
    }
  }
  
  let allOptions = [quizCurrentItem.meaning, ...wrongOptions].sort(() => Math.random() - 0.5);
  let optionsContainer = document.getElementById('quizOptions');
  optionsContainer.innerHTML = '';
  
  allOptions.forEach(option => {
    let btn = document.createElement('button');
    btn.innerText = option;
    btn.style.cssText = 'padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: 0.2s; text-align: center;';
    btn.onclick = () => checkAnswer(option);
    optionsContainer.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (selected === quizCurrentItem.meaning) {
    quizCurrentScore++;
  } else {
    quizCurrentScore = Math.max(0, quizCurrentScore - 1);
  }
  document.getElementById('quizScore').innerText = quizCurrentScore;
  nextQuizQuestion();
}

function endQuiz() {
  document.getElementById('quizQuestion').innerText = 'Игра окончена!';
  document.getElementById('quizOptions').innerHTML = '';
  document.getElementById('quizTimer').innerText = '0';
  document.getElementById('quizCloseBtn').style.display = 'block';
  document.getElementById('quizStartBtn').style.display = 'block';
  document.getElementById('quizStartBtn').innerText = 'Играть снова';
  
  let resultText = 'Ваш результат: ' + quizCurrentScore + ' очков!';
  if (quizCurrentScore > 10) resultText = '🏆 Гений фразеологизмов! ' + resultText;
  else if (quizCurrentScore > 5) resultText = '👍 Отличный результат! ' + resultText;
  else resultText = '😊 Хорошая попытка! ' + resultText;
  
  document.getElementById('quizScore').innerText = resultText;
}
  // === МЕНЮ ИГР ===
function openGamesMenu() {
  document.getElementById('gamesModal').style.display = 'flex';
}

function closeGamesMenu() {
  document.getElementById('gamesModal').style.display = 'none';
}

// === ИГРА "НАЙДИ ПАРУ" (35 СЕКУНД) ===
let memoryTimer = null;
let memoryTimeLeft = 35;
let memoryScore = 0;
let memoryCards = [];
let memorySelected = [];

function startMemoryGame() {
  closeGamesMenu();
  document.getElementById('quizModal').style.display = 'flex';
  document.getElementById('quizTitle').innerText = 'Найди пару: 35 секунд';
  document.getElementById('quizTimer').innerText = '35';
  document.getElementById('quizScore').innerText = '0';
  
  document.getElementById('quizStartBtn').style.display = 'none';
  document.getElementById('quizCloseBtn').style.display = 'block';
  
  memoryTimeLeft = 35;
  memoryScore = 0;
  memorySelected = [];
  let container = document.getElementById('quizOptions');
  
  // Сетка: 2 колонки на телефоне, 3 на ПК
  if (window.innerWidth < 500) {
    container.style.gridTemplateColumns = 'repeat(2, 1fr)';
  } else {
    container.style.gridTemplateColumns = 'repeat(3, 1fr)';
  }
  container.style.display = 'grid';
  container.style.gap = '10px';
  
  let pool = DATA.filter(d => d.type === 'phrase' && d.example).slice(0, 4);
  memoryCards = [];
  pool.forEach(p => {
    memoryCards.push({ id: p.meaning, text: p.text, type: 'text' });
    memoryCards.push({ id: p.meaning, text: p.meaning, type: 'meaning' });
  });
  
  memoryCards.sort(() => Math.random() - 0.5);
  
  container.innerHTML = '';
  memoryCards.forEach((card, index) => {
    let btn = document.createElement('button');
    btn.innerText = card.text; // Текст сразу виден
    btn.dataset.index = index;
    btn.style.cssText = 'padding: 10px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 0.75rem; cursor: pointer; min-height: 80px; display: flex; align-items: center; justify-content: center; text-align: center; word-break: break-word;';
    btn.onclick = () => flipMemoryCard(index, btn);
    container.appendChild(btn);
  });
  
  memoryTimer = setInterval(() => {
    memoryTimeLeft--;
    document.getElementById('quizTimer').innerText = memoryTimeLeft;
    if (memoryTimeLeft <= 0) { clearInterval(memoryTimer); endMemoryGame(); }
  }, 1000);
  
  document.getElementById('quizQuestion').innerText = 'Найдите пару: фразеологизм и его значение';
}

function flipMemoryCard(index, btn) {
  let card = memoryCards[index];
  if (memorySelected.length >= 2 || btn.disabled) return;
  
  // Красим выбранную карточку в оранжевый
  btn.style.background = '#e67e22';
  memorySelected.push({ index, btn, card });
  
  if (memorySelected.length === 2) {
    let [first, second] = memorySelected;
    if (first.card.id === second.card.id && first.index !== second.index) {
      // Совпадение
      memoryScore++;
      document.getElementById('quizScore').innerText = memoryScore;
      first.btn.disabled = true;
      second.btn.disabled = true;
      first.btn.style.background = '#2ecc71';
      second.btn.style.background = '#2ecc71';
      memorySelected = [];
      
      if (memoryScore === 4) {
        clearInterval(memoryTimer);
        endMemoryGame();
      }
    } else {
      // Не совпало
      setTimeout(() => {
        first.btn.style.background = '#3498db';
        second.btn.style.background = '#3498db';
        memorySelected = [];
      }, 500);
    }
  }
}


function endMemoryGame() {
  document.getElementById('quizQuestion').innerText = 'Игра окончена!';
  document.getElementById('quizOptions').innerHTML = '';
  document.getElementById('quizOptions').style.gridTemplateColumns = '1fr 1fr';
  document.getElementById('quizTimer').innerText = '0';
  document.getElementById('quizCloseBtn').style.display = 'block';
  document.getElementById('quizStartBtn').style.display = 'none';
  document.getElementById('quizScore').innerText = 'Найдено пар: ' + memoryScore + ' из 4';
}

window.onload = () => {
  applyTheme();
  nextItem();
};
